<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050506">
<title>Журнал — Quorvox</title>
<meta name="description" content="Релизы, обновления и новости команды Quorvox.">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body data-page="journal">
<header class="top" id="top"></header>

<main>
  <section class="page-head">
    <div class="wrap">
      <span class="mono">Журнал</span>
      <h1 style="margin-top:14px">Релизы и обновления</h1>
      <p>Что выпустили и что поменяли. Подробности и обсуждение — в нашем <a href="https://t.me/Quorvox_team" target="_blank" rel="noopener">Telegram-канале</a>.</p>
    </div>
  </section>

  <section class="sec">
    <div class="wrap" id="journal"></div>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<script src="journal-data.js?v=2"></script>
<script>
  // разделы в порядке показа, записи внутри — от новых к старым
  document.getElementById('journal').innerHTML = ['Релизы', 'Обновления', 'Команда'].map((cat) =>
    '<div class="list"><h2>' + cat + '</h2><ul class="rows">' +
    JOURNAL.filter((e) => e.cat === cat).map(rowHtml).join('') + '</ul></div>'
  ).join('');
</script>
<script src="app.js?v=2"></script>
</body>
</html>
