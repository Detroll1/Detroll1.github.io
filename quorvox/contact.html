<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050506">
<title>Контакты — Quorvox</title>
<meta name="description" content="Напишите команде Quorvox: Telegram, почта или заявка с сайта.">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body data-page="contact">
<header class="top" id="top"></header>

<main>
  <section class="page-head">
    <div class="wrap">
      <span class="mono">Контакты</span>
      <h1 style="margin-top:14px">Обсудим ваш проект</h1>
      <p>Опишите задачу в паре строк. В ответ напишем, можно ли её сделать, сколько займёт и сколько будет стоить.</p>
    </div>
  </section>

  <section class="sec">
    <div class="wrap contact">
      <ul class="clist">
        <li><span class="mono">Telegram</span><a href="https://t.me/Quorvox_team" target="_blank" rel="noopener">@Quorvox_team</a></li>
        <li><span class="mono">Почта</span><a href="mailto:neironkabot@gmail.com">neironkabot@gmail.com</a></li>
        <li><span class="mono">GitHub</span><a href="https://github.com/Quorvox" target="_blank" rel="noopener">github.com/Quorvox</a></li>
        <li><span class="mono">Город</span><span>Североморск, работаем удалённо</span></li>
      </ul>
      <form class="form" action="https://formsubmit.co/neironkabot@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="Заявка с сайта Quorvox">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
        <label>Как к вам обращаться<input name="name" required autocomplete="name"></label>
        <label>Telegram или почта для ответа<input name="contact" required></label>
        <label>Что нужно сделать<textarea name="task" rows="5" required placeholder="Например: бот для приёма заказов в Telegram"></textarea></label>
        <button class="btn" type="submit">Отправить заявку</button>
      </form>
    </div>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<script src="app.js?v=2"></script>
</body>
</html>
