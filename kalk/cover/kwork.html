<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обложка Kwork</title>
<style>
  @font-face { font-family: "Golos"; src: url("../../assets/fonts/Golos-Text-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Golos"; src: url("../../assets/fonts/Golos-Text-400.woff2") format("woff2"); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1320px; height: 880px; overflow: hidden; background: #16181b; font-family: "Golos", sans-serif; color: #fff; position: relative; }
  .glow { position: absolute; right: -120px; top: -160px; width: 900px; height: 900px; background: radial-gradient(closest-side, rgba(232, 100, 27, .35), transparent); }
  .text { position: absolute; left: 72px; top: 92px; width: 560px; }
  .pill { display: inline-block; font-size: 26px; padding: 10px 22px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: #ffb48a; margin-bottom: 34px; }
  h1 { font-size: 70px; line-height: 1.02; letter-spacing: -.03em; font-weight: 600; }
  h1 em { font-style: normal; color: #ff8a4c; }
  p { margin-top: 30px; font-size: 32px; line-height: 1.35; color: rgba(255, 255, 255, .72); }
  .price { position: absolute; left: 72px; bottom: 72px; display: flex; gap: 18px; }
  .price span { font-size: 30px; padding: 16px 26px; border-radius: 18px; background: #fff; color: #16181b; font-weight: 600; }
  .price span + span { background: rgba(255, 255, 255, .1); color: #fff; font-weight: 400; }
  .ph { position: absolute; width: 300px; border-radius: 40px; background: #0d0e10; padding: 10px; box-shadow: 0 40px 80px rgba(0, 0, 0, .5), 0 0 0 2px rgba(255, 255, 255, .08); }
  .ph img { display: block; width: 100%; border-radius: 30px; }
  .ph1 { right: 330px; top: 150px; transform: rotate(-6deg); }
  .ph2 { right: 60px; top: 70px; transform: rotate(5deg); z-index: 2; }
  .ph3 { right: 190px; top: 380px; transform: rotate(-1deg); z-index: 3; width: 280px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <span class="pill">Калькулятор для бизнеса</span>
    <h1>Клиент сам считает цену — <em>заявка</em> у вас в Telegram</h1>
    <p>Под ваши услуги, цены и логотип. Готово за 1 день.</p>
  </div>
  <div class="price"><span>от 3 000 ₽</span><span>без абонплаты</span></div>
  <div class="ph ph1"><img src="demo-potolki.png" alt=""></div>
  <div class="ph ph2"><img src="demo-tehnika.png" alt=""></div>
  <div class="ph ph3"><img src="demo-klining.png" alt=""></div>
</body>
</html>
